
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#5147b5">
</head>
<body>

    <header class="header">
    <div>
        <h1>Smart Task Manager</h1>
        <p>Plan smart. Achieve more.</p>
    </div>

    <div class="header-right">
        <div class="date-box" id="todayDate"></div>
        <button id="themeToggle" class="theme-btn">🌙 Dark Mode</button>
    </div>
</header>
    <main class="container">

        <section class="welcome">
            <div>
                <h2>Welcome Back!</h2>
                <p>Organize your tasks and boost your productivity.</p>
            </div>
            <div class="welcome-icon">✓</div>
        </section>

        <section class="dashboard">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Completed</span>
                <h2 id="doneCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Overdue</span>
                <h2 id="overdueCount">0</h2>
            </div>
            <div class="stat-card">
    <span>Productivity Score</span>
    <h2 id="productivityScore">0%</h2>
</div>
        </section>

        <section class="progress-section">
            <div class="section-heading">
                <h3>Overall Progress</h3>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </section>

        <section class="task-form-section">
            <h2>Create New Task</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Name</label>
                    <input type="text" id="taskTitle"
                        placeholder="Enter your task name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option>Study</option>
                            <option>Work</option>
                            <option>Personal</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option>High</option>
                            <option selected>Medium</option>
                            <option>Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate" required>
                    </div>
                </div>

                <button type="submit" class="add-button">+ Add Task</button>
            </form>
        </section>

        <section class="manage-section">
            <div class="section-heading">
                <h2>Manage Tasks</h2>
                <span id="taskSummary">0 tasks</span>
            </div>

            <div class="task-controls">
                <input type="search" id="searchInput"
                    placeholder="Search tasks...">

                <select id="filterSelect">
                    <option value="All">All Tasks</option>
                    <option value="Pending">Pending</option>
                    <option value="Done">Completed</option>
                </select>
            </div>

            <div id="taskList" class="task-list"></div>
        </section>

        <footer>
            <p>Smart Task Manager | Productivity Made Simple</p>
        </footer>

    </main>

    <script src="script.js"></script>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
            .then(() => console.log("PWA Service Worker Registered"))
            .catch(error => console.log("Service Worker Error:", error));
    });
}
</script>
</body>
</html>
